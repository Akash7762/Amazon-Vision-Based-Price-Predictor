name: API container

# Builds the API's Docker image and checks it the way Render's free plan runs
# it: 512 MB of memory and a tenth of a CPU. Nothing is published; Render
# builds its own copy from the same Dockerfile.
on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "model/**"
      - "deploy/**"
      - "e2e/fixtures/**"
      - ".dockerignore"
      - ".github/workflows/api-container.yml"
  pull_request:
    paths:
      - "backend/**"
      - "model/**"
      - "deploy/**"
      - "e2e/fixtures/**"
      - ".dockerignore"
      - ".github/workflows/api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: docker build -f deploy/api.Dockerfile -t price-api .

      - name: Start it with the free plan's limits
        run: docker run -d --name api --memory 512m --cpus 0.1 -p 8000:10000 price-api

      - name: Make photo-sized test images (with the Pillow inside the image)
        run: |
          docker exec api python -c "from PIL import Image; Image.effect_noise((1600, 1600), 60).convert('RGB').save('/tmp/photo-1600.jpg', quality=92); Image.linear_gradient('L').resize((4000, 4000)).convert('RGB').save('/tmp/photo-16mp.jpg', quality=85)"
          docker cp api:/tmp/photo-1600.jpg .
          docker cp api:/tmp/photo-16mp.jpg .

      # 12 photo-sized uploads at once took the 512 MB free server down once;
      # the biggest image it accepts (16 MP) must not either.
      - name: Check it answers with the reference prices, and survives load
        run: >
          python3 deploy/smoke_test.py http://localhost:8000 --wait 180
          --also photo-16mp.jpg --burst 12 --burst-photo photo-1600.jpg

      - name: Check the container wasn't killed for running out of memory
        if: always()
        run: |
          echo "OOMKilled: $(docker inspect -f '{{.State.OOMKilled}}' api), restarts: $(docker inspect -f '{{.RestartCount}}' api), running: $(docker inspect -f '{{.State.Running}}' api)"
          test "$(docker inspect -f '{{.State.OOMKilled}}' api)" = "false"

      - name: Memory use and server log
        if: always()
        run: |
          docker stats --no-stream --format "memory in use: {{.MemUsage}}" api || true
          docker logs api || true
