name: Tests

# Every push to dev or main, and every pull request: the backend and model
# tests (with the real model), the web app's lint, type check and build, and
# the end-to-end tests in Chrome, Edge and an emulated Android phone.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Get the model, so the real-model tests run too
        run: python backend/download_model.py
      - run: python -m pytest -q

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build type-checks the app too. (A bare tsc run on a fresh checkout
      # fails: types such as LayoutProps are generated by the build.)
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON: python  # the end-to-end tests start the API with this
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/download_model.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      # Chrome and Edge are already on GitHub's Ubuntu machines.
      - run: npx playwright test
        working-directory: e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
